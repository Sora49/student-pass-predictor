# Run from the monitoring/ folder:  docker compose up --build -d
services:
  ml-app:
    build:
      context: ..
      dockerfile: monitoring/Dockerfile
    ports:
      - "5000:5000"

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - ml-app

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
